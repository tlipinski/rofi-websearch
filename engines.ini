# Search engines for rofi-websearch, in ~/.config/rofi-websearch/engines.ini.
# Created from the plugin's example on its first start; edit it freely.
#
# The section name is the keyword, url has {} where the query goes.
# The first engine is the default until another is picked with Alt+d.
# Optional: icon = image path or icon theme name, instead of the favicon.

[g]
name = Google
url  = https://www.google.com/search?q={}

[dd]
name = DuckDuckGo
url  = https://duckduckgo.com/?q={}

[w]
name = Wikipedia
url  = https://en.wikipedia.org/w/index.php?search={}

[yt]
name = YouTube
url  = https://www.youtube.com/results?search_query={}

[im]
name = IMDb
url  = https://www.imdb.com/find/?q={}

[gh]
name = GitHub
url  = https://github.com/search?q={}&type=repositories

[o]
name = OpenStreetMap
url  = https://www.openstreetmap.org/search?query={}

[m]
name = Google Maps
url  = https://www.google.com/maps/search/{}

[t]
name = Google Translate
url  = https://translate.google.com/?sl=auto&tl=en&text={}&op=translate

[r]
name = Reddit
url  = https://www.reddit.com/search/?q={}
